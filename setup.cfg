[tool:pytest]
asyncio_mode = auto
;addopts = --cov=. --cov-report=html --cov-report=term-missing
;unfreeze to create a coverage report
testpaths = tests

[coverage:run]
source = src
omit =
    */tests/*
    */venv/*
    */.venv/*
    */main.py
    */__init__.py

[coverage:html]
directory = tests/coverage