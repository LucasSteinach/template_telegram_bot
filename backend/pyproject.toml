[tool.poetry]
name = "tm-template"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.15"

fastapi = "0.141.1"
uvicorn = "0.52.4"
aiogram = "3.30.0"

sqlalchemy = "2.0.36"
alembic = "1.14.0"
asyncpg = "0.30.0"
psycopg = "3.3.4"
psycopg-binary = "3.3.4"
aiosqlite = "0.22.1"
redis = "8.1.0"
aio-pika = "10.0.1"

pydantic = "2.9.2"
pydantic-settings = "2.6.1"
python-dotenv = "1.2.2"
email-validator = "2.3.0"

pyjwt = "2.13.0"
bcrypt = "5.0.0"
aiofiles = "24.1.0"
aiohttp = "3.10.11"

setuptools = "83.0.0"


[tool.poetry.group.dev.dependencies]

pytest = "9.0.3"
pytest-asyncio = "1.4.0"
fakeredis = "2.37.0"

coverage = "7.15.2"
coverage-badge = "1.1.2"
pytest-cov = "7.1.0"

ruff = "0.16.0"
testcontainers = "^4.15.0"
pika = "^1.4.4"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "Depends",
    "fastapi.security.HTTPBearer",
    "HTTPBearer",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:The @wait_container_is_ready decorator is deprecated:DeprecationWarning"
]
addopts = "--cov=. --cov-report=html --cov-report=term-missing"
#unfreeze to create a coverage report

testpaths = [
    "tests",
]
# filterwarnings = [
#     "error::RuntimeWarning",
# ]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "alembic/*",
    "*/venv/*",
    "*/.venv/*",
    "*api_main.py",
    "*bot_main.py",
#    "*/__init__.py",
    "*/env.py",
]
concurrency = ["thread", "greenlet"]

[tool.coverage.html]
directory = "tests/coverage"

[tool.coverage.report]
exclude_lines = [
    "raise NotImplementedError",
]
