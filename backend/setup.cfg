[tool:pytest]
asyncio_mode = auto
;addopts = --cov=. --cov-report=html --cov-report=term-missing
;unfreeze to create a coverage report

testpaths = tests
;filterwarnings =
;    error::RuntimeWarning

[coverage:run]
source = .
omit =
    tests/*
    alembic/*
    */venv/*
    */.venv/*
    *api_main.py
    *bot_main.py
    */__init__.py
    */env.py

[coverage:html]
directory = tests/coverage